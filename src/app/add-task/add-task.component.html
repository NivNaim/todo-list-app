<form
  action=""
  method="post"
  [formGroup]="addTaskForm"
  (ngSubmit)="onSubmit(addTaskForm)"
>
  <div class="field-container">
    <label for="task-title">Title</label>
    <input
      type="text"
      class="task-title"
      name="task-title"
      formControlName="title"
      autocomplete="off"
    />
  </div>
  <div class="field-container">
    <label for="task-date">Task Date</label>
    <input type="date" name="task-date" formControlName="date" />
  </div>
  <button class="add-task" type="submit" [disabled]="addTaskForm.invalid">
    <i class="fa-regular fa-plus"></i> <span>Add Task</span>
  </button>
</form>
