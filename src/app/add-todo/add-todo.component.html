<form action="" method="post">
  <div class="field-container">
    <label for="todo-description">Title</label>
    <input type="text" class="todo-title" name="todo-title" />
  </div>
  <div class="field-container">
    <label for="todo-date">Task Date</label>
    <input type="date" name="todo-date" />
  </div>
  <button type="submit">
    <i class="fa-thin fa-plus" id="add-icon"></i> <span>Add Task</span>
  </button>
</form>
