<div class="search-bar-container">
  <img src="../../assets/icons/write.png" alt="write-icon" width="50" height="50" />
  <form>
    <input
      type="text"
      name="search-todos"
      id="search-todos"
      placeholder="Search"
      autocomplete="off"
      [(ngModel)]="inputValue"
      (input)="onInputChange()"
    />
    <button type="submit"><i class="fa fa-search" id="search-icon"></i></button>
  </form>
</div>
